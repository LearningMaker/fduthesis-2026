
name: Build FDU Thesis Template

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show TeX versions
        run: |
          xetex --version
          l3build version

      - name: Build template
        run: |
          l3build unpack

      - name: Check generated files
        run: |
          ls -lh build/unpacked/
          test -f build/unpacked/fduthesis-2026.cls
          test -f build/unpacked/fduthesis-2026-en.cls
          test -f build/unpacked/fduthesis-2026.def
          test -f build/unpacked/fdulogo.sty
          test -f build/unpacked/fdudoc.cls

            - name: Package template files
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          files = [
              "fduthesis-2026.cls",
              "fduthesis-2026-en.cls",
              "fduthesis-2026.def",
              "fdulogo.sty",
              "fdudoc.cls",
          ]

          source = Path("build/unpacked")
          output = Path("fduthesis-2026-template.zip")

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as z:
              for filename in files:
                  path = source / filename
                  assert path.exists(), f"Missing file: {path}"
                  z.write(path, arcname=filename)

          print(f"Created {output}")
          print(f"Size: {output.stat().st_size} bytes")
          PY

      - name: Upload template artifact
        uses: actions/upload-artifact@v4
        with:
          name: fduthesis-2026-template
          path: fduthesis-2026-template.zip
          if-no-files-found: error
